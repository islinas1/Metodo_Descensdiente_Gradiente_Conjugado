<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#7b68ee"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#1a1a2e"/>
  <g transform="translate(60,60)">
    <!-- Target circles -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#g9)" stroke-width="2" opacity="0.25"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#g9)" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#g9)" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="url(#g9)"/>
    <!-- Crosshair -->
    <line x1="-32" y1="0" x2="-6" y2="0" stroke="url(#g9)" stroke-width="1.5" opacity="0.5"/>
    <line x1="6" y1="0" x2="32" y2="0" stroke="url(#g9)" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-32" x2="0" y2="-6" stroke="url(#g9)" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="6" x2="0" y2="32" stroke="url(#g9)" stroke-width="1.5" opacity="0.5"/>
    <!-- Convergence path spiral -->
    <path d="M-25,-20 L-10,-8 L5,-15 L2,0" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-25" cy="-20" r="3" fill="#ff6b6b"/>
    <!-- Arrow at end -->
    <polygon points="2,0 -1,-4 5,-2" fill="#ff6b6b"/>
