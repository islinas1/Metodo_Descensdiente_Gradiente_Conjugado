<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a5a"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#1a1a2e"/>
  <g transform="translate(60,60)">
    <!-- Neural network connections -->
    <line x1="-25" y1="-18" x2="0" y2="-12" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-25" y1="-18" x2="0" y2="0" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-25" y1="0" x2="0" y2="-12" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-25" y1="0" x2="0" y2="0" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-25" y1="0" x2="0" y2="12" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-25" y1="18" x2="0" y2="0" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="-25" y1="18" x2="0" y2="12" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="-12" x2="25" y2="-9" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="-12" x2="25" y2="9" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="0" x2="25" y2="-9" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="0" x2="25" y2="9" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="12" x2="25" y2="-9" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="12" x2="25" y2="9" stroke="url(#g4)" stroke-width="1.5" opacity="0.35"/>
    <!-- Input layer -->
    <circle cx="-25" cy="-18" r="5.5" fill="url(#g4)" opacity="0.9"/>
    <circle cx="-25" cy="0" r="5.5" fill="url(#g4)" opacity="0.9"/>
    <circle cx="-25" cy="18" r="5.5" fill="url(#g4)" opacity="0.9"/>
    <!-- Hidden layer -->
    <circle cx="0" cy="-12" r="5.5" fill="url(#g4)" opacity="0.7"/>
    <circle cx="0" cy="0" r="5.5" fill="url(#g4)" opacity="0.7"/>
    <circle cx="0" cy="12" r="5.5" fill="url(#g4)" opacity="0.7"/>
    <!-- Output layer -->
    <circle cx="25" cy="-9" r="5.5" fill="url(#g4)" opacity="0.5"/>
    <circle cx="25" cy="9" r="5.5" fill="url(#g4)" opacity="0.5"/>
  </g>
</svg>
