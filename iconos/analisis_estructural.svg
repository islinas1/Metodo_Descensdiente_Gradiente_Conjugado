<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00a888"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#1a1a2e"/>
  <g transform="translate(60,60)">
    <!-- Building structure -->
    <rect x="-22" y="-30" width="44" height="52" rx="3" fill="none" stroke="url(#g1)" stroke-width="3"/>
    <!-- Floors -->
    <line x1="-22" y1="-10" x2="22" y2="-10" stroke="url(#g1)" stroke-width="2"/>
    <line x1="-22" y1="5" x2="22" y2="5" stroke="url(#g1)" stroke-width="2"/>
    <!-- Windows -->
    <rect x="-16" y="-26" width="10" height="10" rx="1.5" fill="url(#g1)" opacity="0.3"/>
    <rect x="6" y="-26" width="10" height="10" rx="1.5" fill="url(#g1)" opacity="0.3"/>
    <rect x="-16" y="-6" width="10" height="10" rx="1.5" fill="url(#g1)" opacity="0.3"/>
    <rect x="6" y="-6" width="10" height="10" rx="1.5" fill="url(#g1)" opacity="0.3"/>
    <!-- Door -->
    <rect x="-6" y="10" width="12" height="12" rx="1.5" fill="url(#g1)" opacity="0.5"/>
    <!-- Base -->
    <line x1="-30" y1="22" x2="30" y2="22" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>
    <!-- Force arrows -->
    <line x1="28" y1="-30" x2="28" y2="-18" stroke="#ff6b6b" stroke-width="2.5"/>
    <polygon points="28,-15 25,-20 31,-20" fill="#ff6b6b"/>
    <line x1="-28" y1="-25" x2="-18" y2="-25" stroke="#ff6b6b" stroke-width="2.5"/>
    <polygon points="-15,-25 -20,-28 -20,-22" fill="#ff6b6b"/>
  </g>
</svg>
